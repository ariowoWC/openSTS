<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
    <a href="/home">Home</a>
    <a href="/addticket">Create ticket</a>
</nav>
<br>
<br>
<table>
    <thead>
        <tr>
            <th>Raised by</th>
            <th>Ticket type</th>
            <th>Description</th>
            <th>Time Submitted</th>
            <th>Ticket ID</th>

            <th></th>
        </tr>
    </thead>
    <tbody>

    {% for ticket_id in tickets %}
        <tr>
        <td> {{ ticket_id[1] }} </td>
        <td> {{ ticket_id[2] }} </td>
        <td> {{ ticket_id[3] }} </td>
            <td>{{ ticket_id[4] }}</td>
        <td> {{ ticket_id[0] }} </td>
        <td> <a href="/edit?{{ ticket_id[0] }}">View </a> </td>
        </tr>
    {% endfor %}
    </tbody>

</table>
  <script>
        // Event delegation for dynamic tables
        const table = document.getElementById('userTable');
        table.addEventListener('click', (event) => {
            const button = event.target.closest('.action-btn');
            if (!button) return;

            getRowColumnDetails(button);
        });

        function getRowColumnDetails(button) {
            const cell = button.closest('td');
            const row = cell.closest('tr');

            if (!cell || !row) {
                alert('Error: Could not find table cell or row.');
                return;
            }

            // Calculate row index (exclude <thead> row)
            const rowIndex = row.rowIndex - 1;
            // Calculate column index
            const columnIndex = cell.cellIndex;

            // Display results (1-based)
            alert(`Clicked Row: ${rowIndex + 1}\nClicked Column: ${columnIndex + 1}`);
        }
    </script>
</body>

</html>
